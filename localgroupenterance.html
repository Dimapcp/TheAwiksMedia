<body class="group-page">
    <main class="group-panel">
        <h1 data-i18n="groupTitle">Local Group Media</h1>
        <p data-i18n="groupHint">Use the code shared by your local group administrator.</p>
        <form id="group-entry-form">
            <label for="group-code" data-i18n="groupPrompt">Enter your group code</label>
            <input id="group-code" name="code" type="text" autocomplete="off" required>
            <button type="submit" data-i18n="groupSubmit">Enter group</button>
            <p class="form-error" id="group-error" data-i18n="groupNotFound" hidden></p>
        </form>
        <a class="back-link" href="index.html" data-i18n="back">Back to group entry</a>
    </main>
    <script>
        const groups = {
            AWIKS2026: { name: "The Awiks Local Group", posts: ["Welcome to the local group media"] }
        };
        const form = document.getElementById("group-entry-form");
        const error = document.getElementById("group-error");
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const code = document.getElementById("group-code").value.trim().toUpperCase();
            const group = groups[code];
            if (!group) {
                error.hidden = false;
                return;
            }
            sessionStorage.setItem("awiks-group", JSON.stringify(group));
            window.location.href = "localgroup-1.html";
        });
    </script>
